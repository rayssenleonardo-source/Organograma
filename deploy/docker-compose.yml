services:
  organograma:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: organograma
    ports:
      - "${HOST_PORT:-5001}:5000"
    volumes:
      - ../data/dados.json:/app/data/dados.json
      - ../uploads:/app/uploads
    environment:
      - PORT=5000
      - FLASK_DEBUG=false
    restart: unless-stopped
