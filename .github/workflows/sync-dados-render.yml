name: Sync dados.json from Render

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Full URL for /api/dados (optional)."
        required: false
        default: ""
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-dados-render
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve API URL
        env:
          INPUT_API_URL: ${{ github.event.inputs.api_url }}
          VAR_API_URL: ${{ vars.RENDER_API_DADOS_URL }}
        run: |
          API_URL="$INPUT_API_URL"
          if [ -z "$API_URL" ]; then
            API_URL="$VAR_API_URL"
          fi

          if [ -z "$API_URL" ]; then
            echo "::error::Provide workflow input api_url or repository variable RENDER_API_DADOS_URL."
            exit 1
          fi

          echo "API_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Fetch latest data
        run: |
          curl -fsSL "$API_URL" -o /tmp/dados-remote.json

      - name: Validate and write dados.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          remote_file = Path("/tmp/dados-remote.json")
          local_file = Path("data/dados.json")

          payload = json.loads(remote_file.read_text(encoding="utf-8"))
          local_file.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/dados.json; then
            echo "No changes in dados.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dados.json
          git commit -m "chore: sync data/dados.json from Render API"
          git push
