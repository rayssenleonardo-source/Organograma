<!DOCTYPE html>

                <rect x="9" y="3" width="6" height="6"></rect>
                <path d="M5 15h14"></path>

                <rect x="2" y="18" width="6" height="6"></rect>

            <h1>Organograma de Cargos</h1>
        </div>

        <div style="display: flex; align-items: center; gap: 15px;">
            <button id="btn-export-pdf-org2" class="btn-admin" title="Salvar PDF do organograma de cargos" style="background:none; border:none; cursor:pointer; color:#64748b; display:flex; align-items:center; gap:6px;">

            <a href="Admin/login.html?next=admin-org2.html" class="btn-admin" title="Acesso Administrativo" style="text-decoration:none; color:#64748b; display:flex; align-items:center; gap:6px;">

                <span style="font-size:12px; font-weight:700; letter-spacing:.4px;">ADMIN</span>
            </a>

            <a href="index.html" class="btn-admin" title="Voltar para o dashboard" style="text-decoration:none; color:#64748b; display:flex; align-items:center; gap:6px;">

                <span style="font-size:12px; font-weight:700; letter-spacing:.4px;">VOLTAR</span>

    <div id="org2-scroll-top-wrap" class="org2-scroll-top-wrap" aria-hidden="true">

            <div id="org2-scroll-top-inner" class="org2-scroll-top-inner"></div>
