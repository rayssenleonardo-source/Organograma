services:
  - type: web
    name: organograma
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLASK_DEBUG
        value: "false"
      - key: DATA_FILE
        value: /var/data/dados.json
      - key: UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: organograma-data
      mountPath: /var/data
      sizeGB: 1
